name: Test company configuration
on:
  pull_request:
    paths:
      - 'index.html'
      - 'customization.js'
      - 'multicity.js'
      - 'app-config.js'
      - 'firestore.rules'
      - 'sw.js'
      - 'scripts/build_pwa.py'
      - 'tests/**'
      - '.github/workflows/test-company-config.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Browser dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build and exercise company editor
        run: |
          python scripts/build_pwa.py
          python tests/check_company_builder.py
      - name: Firestore role tests
        run: |
          npm install --no-save firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@13.35.1
          npx firebase emulators:exec --only firestore --project demo-company-builder 'node tests/company_rules.cjs'
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-builder-tests
          path: |
            work/company-builder.png
            work/multi-city-mobile.png
            firestore-debug.log
