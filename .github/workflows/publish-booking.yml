name: Publish Transwisata Booking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure public Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static application
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.55.0
          python scripts/build_pwa.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published logo and install icons
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import io, os, time, urllib.request
          from PIL import Image
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          for name, size in [('assets/favicon-32.png', (32,32)), ('assets/logo.png', None), ('assets/icon-192.png', (192,192)), ('assets/icon-512.png', (512,512)), ('assets/apple-touch-icon.png', (180,180))]:
              for attempt in range(6):
                  try:
                      url = base + name + '?build=' + os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url, timeout=20) as response:
                          data = response.read()
                      with Image.open(io.BytesIO(data)) as image:
                          image.verify()
                      with Image.open(io.BytesIO(data)) as image:
                          if size and image.size != size:
                              raise ValueError('Incorrect icon size')
                      print('Verified published image:', name)
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          PY

      - name: Verify live browser branding
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p work
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path="/usr/bin/google-chrome")
              page = browser.new_page()
              settings = []
              page.on("response", lambda response: settings.append(response.url) if "firestore.googleapis.com" in response.url else None)
              try:
                  page.goto(base + "?release=" + os.environ["GITHUB_SHA"], wait_until="domcontentloaded")
                  page.wait_for_function("typeof getCurrentCompanyConfig==='function'", timeout=60000)
                  page.wait_for_timeout(8000)
                  assert page.title() == "TRANSWISATA ONLINE BOOKING", page.title()
                  assert page.locator("#appTagline").inner_text() == "PRIMA AVIATION"
                  assert page.evaluate("getCurrentCompanyConfig().appName") == "TRANSWISATA PRIMA AVIATION"
                  assert page.evaluate("Array.from(document.scripts).find(s=>s.src.includes('customization.js')).src").endswith("?v=" + os.environ["GITHUB_SHA"])
                  print("LIVE_BRANDING_VERIFIED", page.title(), page.locator("#appTagline").inner_text(), "Firebase responses:", len(settings))
              finally:
                  page.screenshot(path="work/live-branding.png")
                  browser.close()
          PY
      - name: Save live branding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-branding
          path: work/live-branding.png
