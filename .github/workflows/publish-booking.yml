name: Publish Transwisata Booking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure public Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static application
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build_pwa.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published logo and install icons
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import io, os, time, urllib.request
          from PIL import Image
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          for name, size in [('assets/logo.png', None), ('assets/icon-192.png', (192,192)), ('assets/icon-512.png', (512,512)), ('assets/apple-touch-icon.png', (180,180))]:
              for attempt in range(6):
                  try:
                      url = base + name + '?build=' + os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url, timeout=20) as response:
                          data = response.read()
                      with Image.open(io.BytesIO(data)) as image:
                          image.verify()
                      with Image.open(io.BytesIO(data)) as image:
                          if size and image.size != size:
                              raise ValueError('Incorrect icon size')
                      print('Verified published image:', name)
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          PY
